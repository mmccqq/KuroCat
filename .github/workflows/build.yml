name: Build Whiskerkey (macOS, Windows & Linux/UOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Releases are published only by scripts/release.sh (see docs/releasing.md).
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build standalone Whiskerkey.exe
        shell: cmd
        run: |
          cd windows
          call build.bat
          dir Whiskerkey.exe

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whiskerkey-Windows-x64
          path: windows/Whiskerkey.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check coat artwork and native action regressions
        run: bash scripts/check-skins.sh

      - name: Check covered eye pixels
        run: bash scripts/check-eye-closure.sh

      - name: Build Universal Whiskerkey.app (Apple Silicon + Intel)
        run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --sequesterRsrc --keepParent Whiskerkey.app Whiskerkey-macOS-universal.zip
          ls -lh Whiskerkey-macOS-universal.zip

      - name: Upload macOS universal app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whiskerkey-macOS-universal
          path: Whiskerkey-macOS-universal.zip

  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            tar_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            tar_arch: arm64
    runs-on: ${{ matrix.runner }}
    # Build inside Debian 10 "buster" (glibc 2.28, GTK 3.24, GCC 8). The previous Ubuntu 22.04
    # image produced binaries needing glibc 2.34+, which 统信 UOS 20 (glibc 2.28) and 银河麒麟 V10
    # (glibc 2.31) cannot run — on Kylin that showed up as "installation always fails".
    # The container is started with `docker run` (not `container:`) so actions/checkout's Node
    # runtime never has to run on the old glibc.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build KuroCat Linux binary, .deb and .tar.gz in Debian 10 (glibc 2.28)
        shell: bash
        run: |
          DEB_VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$DEB_VER" =~ ^[0-9]+\.[0-9]+ ]]; then DEB_VER="1.2.0"; fi
          docker run --rm -v "$PWD":/src -w /src \
            -e DEB_VER="$DEB_VER" -e TAR_ARCH="${{ matrix.tar_arch }}" -e KUROCAT_MAX_GLIBC=2.28 \
            debian:buster bash -euo pipefail -c '
              # buster is archived: point apt at archive.debian.org
              sed -i -e "s|deb.debian.org|archive.debian.org|g" \
                     -e "s|security.debian.org|archive.debian.org|g" \
                     -e "/buster-updates/d" /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                g++ pkg-config libgtk-3-dev libcairo2-dev libx11-dev libxi-dev dpkg-dev binutils
              cd linux
              chmod +x build.sh build_deb.sh install.sh uninstall.sh
              ./build.sh
              ./build_deb.sh "$DEB_VER"
              tar -czf "KuroCat-Linux-${TAR_ARCH}.tar.gz" \
                kurocat kurocat.desktop kurocat.svg install.sh uninstall.sh 安装说明.txt
            '
          sudo chown -R "$(id -u):$(id -g)" linux
          ls -lh "linux/KuroCat-Linux-${{ matrix.arch }}.deb" "linux/KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Linux-${{ matrix.arch }}
          path: |
            linux/KuroCat-Linux-${{ matrix.arch }}.deb
            linux/KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz
