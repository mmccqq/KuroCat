name: Release (Windows build)

# A version tag (pushed by scripts/release.sh) builds Whiskerkey.exe on Windows, runs the self-tests,
# and stores it as the build artifact "Whiskerkey-Windows-x64". The script downloads it and creates the
# release itself, with the macOS build (signed on the maintainer's Mac) and the Windows exe together.
# Only the script creates releases: GitHub can't look up a draft by its tag, so two creators would
# make two drafts.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Version matches the tag
        shell: bash
        run: |
          v=$(sed -n 's/.*APP_VERSION = L"\([^"]*\)".*/\1/p' windows/src/main.cpp)
          echo "APP_VERSION=$v tag=$GITHUB_REF_NAME"
          test "v$v" = "$GITHUB_REF_NAME"

      - name: Build Whiskerkey.exe
        shell: cmd
        run: |
          cd windows
          call build.bat

      - name: Self-tests
        shell: cmd
        run: |
          cd windows
          start "" /wait Whiskerkey.exe --claude-selftest
          if errorlevel 1 (type whiskerkey-claude-selftest.txt & exit /b 1)
          start "" /wait Whiskerkey.exe --update-selftest
          if errorlevel 1 (type whiskerkey-update-selftest.txt & exit /b 1)
          echo self-tests passed

      - name: Store the Windows build
        shell: bash
        run: cp windows/Whiskerkey.exe Whiskerkey-Windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Whiskerkey-Windows-x64
          path: Whiskerkey-Windows-x64.exe
          if-no-files-found: error
