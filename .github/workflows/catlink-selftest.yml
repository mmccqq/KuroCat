name: Cat Link self-test (Windows)

# Builds KuroCat.exe on a real Windows machine and runs `KuroCat.exe --link-selftest`:
# crypto/JSON against the macOS test vectors, two sessions over the public relay, and
# (optionally) a conversation with a macOS peer that joined the given pairing code.
on:
  push:
    branches: [ cat-link, claude-code-alerts, auto-update ]
  workflow_dispatch:
    inputs:
      code:
        description: Pairing code a macOS peer has joined (optional)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build KuroCat.exe
        shell: cmd
        run: |
          cd windows
          call build.bat

      - name: Run Cat Link self-test
        shell: cmd
        env:
          PEER_CODE: ${{ github.event.inputs.code }}
        run: |
          cd windows
          start "" /wait KuroCat.exe --link-selftest %PEER_CODE%
          set RC=%ERRORLEVEL%
          type kurocat-selftest.txt
          exit /b %RC%

      - name: Run Claude Code hook self-test
        if: always()
        shell: cmd
        run: |
          cd windows
          start "" /wait KuroCat.exe --claude-selftest
          set RC=%ERRORLEVEL%
          if exist kurocat-claude-selftest.txt type kurocat-claude-selftest.txt
          exit /b %RC%

      - name: Run update self-test
        if: always()
        shell: cmd
        run: |
          cd windows
          start "" /wait KuroCat.exe --update-selftest
          set RC=%ERRORLEVEL%
          if exist kurocat-update-selftest.txt type kurocat-update-selftest.txt
          exit /b %RC%

      - name: Render preview sheet
        if: always()
        shell: cmd
        run: |
          cd windows
          start "" /wait KuroCat.exe --render-preview preview.png
          dir preview.png

      - name: Upload KuroCat.exe and the self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Windows-x64-catlink
          path: |
            windows/KuroCat.exe
            windows/kurocat-selftest.txt
            windows/kurocat-claude-selftest.txt
            windows/kurocat-update-selftest.txt
            windows/preview.png
