name: Cat Link self-test (Windows)

# Builds Whisku.exe on a real Windows machine and runs `Whisku.exe --link-selftest`:
# crypto/JSON against the macOS test vectors, two sessions over the public relay, and
# (optionally) a conversation with a macOS peer that joined the given pairing code.
on:
  push:
    branches: [ cat-link, claude-code-alerts, auto-update ]
  workflow_dispatch:
    inputs:
      code:
        description: Pairing code a macOS peer has joined (optional)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Whisku.exe
        shell: cmd
        run: |
          cd windows
          call build.bat

      - name: Run Cat Link self-test
        shell: cmd
        env:
          PEER_CODE: ${{ github.event.inputs.code }}
        run: |
          cd windows
          start "" /wait Whisku.exe --link-selftest %PEER_CODE%
          set RC=%ERRORLEVEL%
          type whiskerkey-selftest.txt
          exit /b %RC%

      - name: Run Claude Code hook self-test
        if: always()
        shell: cmd
        run: |
          cd windows
          start "" /wait Whisku.exe --claude-selftest
          set RC=%ERRORLEVEL%
          if exist whiskerkey-claude-selftest.txt type whiskerkey-claude-selftest.txt
          exit /b %RC%

      - name: Run break reminder self-test
        if: always()
        shell: cmd
        run: |
          cd windows
          start "" /wait Whisku.exe --break-selftest
          set RC=%ERRORLEVEL%
          if exist whiskerkey-break-selftest.txt type whiskerkey-break-selftest.txt
          exit /b %RC%

      - name: Run update self-test
        if: always()
        shell: cmd
        run: |
          cd windows
          start "" /wait Whisku.exe --update-selftest
          set RC=%ERRORLEVEL%
          if exist whiskerkey-update-selftest.txt type whiskerkey-update-selftest.txt
          exit /b %RC%

      - name: Render preview sheet
        if: always()
        shell: cmd
        run: |
          cd windows
          start "" /wait Whisku.exe --render-preview preview.png
          dir preview.png

      - name: Upload Whisku.exe and the self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Whisku-Windows-x64-selftest
          path: |
            windows/Whisku.exe
            windows/whiskerkey-selftest.txt
            windows/whiskerkey-claude-selftest.txt
            windows/whiskerkey-break-selftest.txt
            windows/whiskerkey-update-selftest.txt
            windows/preview.png
